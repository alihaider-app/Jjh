<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Neural Core Wave Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.35"/>

  <!-- Center Hexagon / Shield Backdrop -->
  <polygon points="256,150 348,203 348,309 256,362 164,309 164,203" fill="url(#primaryGrad)" opacity="0.15"/>
  <polygon points="256,150 348,203 348,309 256,362 164,309 164,203" fill="none" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Monogram ALI Letters -->
  <g fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900">
    <text x="256" y="278" font-size="78" letter-spacing="4" fill="url(#primaryGrad)">ALI</text>
  </g>

  <!-- Crown for Boss Authority -->
  <path d="M216,140 L236,170 L256,135 L276,170 L296,140 L288,185 L224,185 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <circle cx="216" cy="136" r="4" fill="#fbbf24"/>
  <circle cx="256" cy="131" r="5" fill="#fef08a"/>
  <circle cx="296" cy="136" r="4" fill="#fbbf24"/>

  <!-- Audio Wave Bars on Bottom -->
  <g fill="#06b6d4" opacity="0.8">
    <rect x="206" y="380" width="6" height="24" rx="3"/>
    <rect x="220" y="372" width="6" height="40" rx="3"/>
    <rect x="234" y="364" width="6" height="56" rx="3"/>
    <rect x="248" y="358" width="6" height="68" rx="3"/>
    <rect x="262" y="364" width="6" height="56" rx="3"/>
    <rect x="276" y="372" width="6" height="40" rx="3"/>
    <rect x="290" y="380" width="6" height="24" rx="3"/>
    <rect x="304" y="386" width="6" height="12" rx="3"/>
    <rect x="192" y="386" width="6" height="12" rx="3"/>
  </g>
</svg>
